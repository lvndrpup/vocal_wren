[package]
name = "vt-ffi"
description = "The only crate Kotlin sees: UniFFI exports over the Vocal Wren core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# No `[lints] workspace = true`: pedantic lints would also run over the code
# the uniffi macros generate, which this crate does not control.

[lib]
name = "vt_ffi"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
uniffi.workspace = true
vt-analysis.workspace = true
