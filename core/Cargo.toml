[workspace]
resolver = "3"
members = ["crates/vt-analysis", "crates/vt-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
publish = false
repository = "https://github.com/lvndrpup/vocal_wren"

[workspace.dependencies]
uniffi = "0.32"
vt-analysis = { path = "crates/vt-analysis" }

# Opted into by crates with `[lints] workspace = true`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
