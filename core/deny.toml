# cargo-deny policy. No GPL/AGPL/LGPL may reach the shipped binary: anything
# not on the allow-list below is denied.

[graph]
targets = ["aarch64-linux-android", "x86_64-linux-android", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # uniffi is MPL-2.0 (file-level copyleft, compatible with shipping).
    "MPL-2.0",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
