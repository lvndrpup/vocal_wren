name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No Gradle wrapper JAR is committed; CI uses this Gradle directly.
  GRADLE_VERSION: "8.14.3"

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Use the runner's preinstalled NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # Installs the toolchain and Android targets pinned in core/rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        working-directory: core
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core and Kotlin bindings
        run: bash scripts/build-android.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug

      - name: Check 16 KB page alignment of native libs
        run: bash scripts/check-16kb.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
